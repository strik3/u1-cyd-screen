; U1 Remote Screen for the ESP32 "Cheap Yellow Display" (ESP32-2432S028R)
;
; Pick the env that matches your board:
;   cyd      - original CYD, one micro-USB port (ILI9341)
;   cyd2usb  - newer CYD with micro-USB + USB-C ports (ST7789)
; If colours look inverted/wrong, try the other one.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	https://github.com/bitbank2/PNGdec.git#2855e785bc1a80763c89a2afd808faf6156d35c6
	https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
	-Os
	; --- PNGdec: line buffer big enough for screens up to 1024px wide (RGBA) ---
	-DPNG_MAX_BUFFERED_PIXELS=8200
	; --- TFT_eSPI setup for the CYD (display on HSPI) ---
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	; backlight (GPIO21) is driven by the firmware via PWM, so TFT_BL is not set
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DDISABLE_ALL_LIBRARY_WARNINGS

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
